<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – InnovateEX</title>
  <meta name="description" content="Get in touch with InnovateEX — reach out with questions, feedback, or collaboration ideas.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo">InnovateEX</div>
      
            <div class="menu-toggle" id="menu-toggle">
                ☰
            </div>

      <div class="nav-links" id="nav-links" >
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main>
   <h1>Contact Us</h1>
    <form id="contact-form">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send</button>
    </form>
    <p id="form-status"></p>
  </main>
  <script src="script.js"></script>
  <script>
   const contactForm = document.getElementById("contact-form");
   const formStatus = document.getElementById("form-status");

   contactForm.addEventListener("submit", function (e) {
      e.preventDefault();
      formStatus.textContent = "Thanks for reaching out! Your message has been noted.";
      formStatus.style.color = "green";
      contactForm.reset();
  });
</script>

    <footer>
     <h3>InnovateEX</h3>

     <p>
        Exploring the latest and emerging technologies shaping the future.
     </p>

     <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
     </div>

     <p class="copyright">
        © 2026 InnovateEX 
     </p>
   </footer>

</body>
</html>
